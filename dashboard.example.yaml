type: custom:anenji-wall-panel
title: ANENJI 11 kW

# Optional room temperature shown in the top-right corner.
# indoor_temperature: sensor.room_temperature

entities:
  solar_power: sensor.anenji_anj_11kw_48v_wifi_p_pv_power
  # One combined value: Grid to Battery + Grid to Load.
  grid_power: sensor.anenji_grid_total
  home_power: sensor.anenji_anj_11kw_48v_wifi_p_load_power
  battery_soc: sensor.anenji_anj_11kw_48v_wifi_p_battery_percent
  battery_charge_today: sensor.anenji_anj_11kw_48v_wifi_p_estimated_battery_charge_energy_today
  battery_discharge_today: sensor.anenji_anj_11kw_48v_wifi_p_estimated_battery_discharge_energy_today
  grid_energy_today: sensor.anenji_anj_11kw_48v_wifi_p_estimated_grid_import_energy_today

  # Add these when the exact entity IDs are known.
  # battery_power: sensor.anenji_battery_power
  # battery_voltage: sensor.anenji_battery_voltage
  # load_percent: sensor.anenji_load_percent
  # inverter_temperature: sensor.anenji_inverter_temperature

outlets:
  # Replace these four entity IDs with the real switches from your Home Assistant.
  - name: Chandelier
    entity: switch.desk_outlet
    icon: mdi:chandelier
  - name: Printer
    entity: switch.printer_outlet
    icon: mdi:printer-3d
  - name: Speaker
    entity: switch.speaker_outlet
    icon: mdi:speaker
  - name: Spare
    entity: switch.spare_outlet
    icon: mdi:power-socket-eu

radio:
  media_player: media_player.wifi_speaker_wifi_speaker
  current_station: sensor.ihor_s_room_wifi_speaker_current_station
  playback_status: sensor.ihor_s_room_wifi_speaker_playback_status
  volume: number.ihor_s_room_wifi_speaker_volume
  play_pause: button.ihor_s_room_wifi_speaker_play_pause
  previous: button.ihor_s_room_wifi_speaker_previous_station
  next: button.ihor_s_room_wifi_speaker_next_station
  station_select: select.ihor_s_room_wifi_speaker_station
  play_selected: button.ihor_s_room_wifi_speaker_play_selected

  stations:
    - name: HIT FM
      option: Hit FM
    - name: HIT BEST
      option: Hit FM - Найбільші хіти
    - name: HIT UA
      option: Hit FM - Українські хіти
    - name: SIM RADIO
      option: Simulator Radio

thresholds:
  active_power: 20
  battery_low: 20
